<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>算法仿真</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #06171b;
      --surface: #09252b;
      --surface-2: #0b3037;
      --line: rgba(108, 228, 213, .2);
      --text: #effffd;
      --muted: #8fb4b2;
      --accent: #6ce4d5;
      --success: #68e6a8;
      --warning: #ffcf72;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 960px;
      color: var(--text);
      font-family: Inter, "Microsoft YaHei", sans-serif;
      background:
        linear-gradient(rgba(108, 228, 213, .035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(108, 228, 213, .035) 1px, transparent 1px),
        var(--bg);
      background-size: 24px 24px;
    }

    .page {
      width: min(1440px, calc(100% - 48px));
      margin: 0 auto;
      padding: 34px 0 48px;
    }

    .page-header {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 28px;
      padding: 4px 8px 24px;
      border-bottom: 1px solid var(--line);
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
    }

    h1 {
      margin: 0;
      color: var(--text);
      font-size: 34px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 10px 0 0;
      color: var(--muted);
      font-size: 13px;
    }

    .online {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding-bottom: 4px;
      color: var(--success);
      font-size: 12px;
      font-weight: 800;
      white-space: nowrap;
    }

    .online::before {
      width: 9px;
      height: 9px;
      content: "";
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 14px rgba(104, 230, 168, .75);
    }

    .layout {
      display: grid;
      grid-template-columns: 280px minmax(0, 1fr) 280px;
      gap: 14px;
      margin-top: 18px;
    }

    .panel {
      padding: 15px;
      background: rgba(8, 25, 30, .94);
      border: 1px solid var(--line);
      border-radius: 7px;
    }

    .panel + .panel { margin-top: 14px; }

    .panel-title {
      display: flex;
      justify-content: space-between;
      margin-bottom: 14px;
      color: var(--text);
      font-size: 14px;
      font-weight: 800;
    }

    .panel-title span {
      color: var(--muted);
      font-size: 10px;
      font-weight: 700;
    }

    .stage {
      min-height: 570px;
      overflow: hidden;
      padding: 0;
      background: #031015;
    }

    .stage-head {
      display: flex;
      justify-content: space-between;
      padding: 15px;
      border-bottom: 1px solid var(--line);
    }

    .stage-head strong { color: var(--warning); font-size: 12px; }

    .ocean {
      position: relative;
      min-height: 500px;
      overflow: hidden;
      background:
        radial-gradient(circle at 46% 50%, rgba(33, 128, 139, .28), transparent 28%),
        linear-gradient(145deg, #113944, #071b25 62%);
    }

    .device {
      position: absolute;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      box-shadow: 0 0 12px currentColor;
    }

    .uav { color: #6ce4ff; background: #6ce4ff; }
    .usv { color: #ff9f45; background: #ff9f45; }
    .uav.one { left: 41%; top: 42%; }
    .uav.two { left: 48%; top: 34%; }
    .uav.three { left: 56%; top: 46%; }
    .usv.one { left: 44%; top: 58%; }
    .usv.two { left: 52%; top: 62%; }
    .usv.three { left: 59%; top: 55%; }

    .trail {
      position: absolute;
      width: 150px;
      height: 72px;
      border: 2px solid #6ce4ff;
      border-color: #6ce4ff transparent transparent transparent;
      border-radius: 50%;
      transform: rotate(-18deg);
      opacity: .8;
    }

    .trail.blue { left: 35%; top: 36%; }
    .trail.orange {
      left: 43%;
      top: 52%;
      border-color: #ff9f45 transparent transparent transparent;
      transform: rotate(18deg);
    }

    .field, select, button {
      width: 100%;
      min-height: 36px;
      margin-top: 9px;
      padding: 0 10px;
      color: var(--text);
      background: #07171c;
      border: 1px solid #28515a;
      border-radius: 4px;
    }

    button {
      color: #061113;
      background: var(--accent);
      border-color: var(--accent);
      font-weight: 800;
    }

    .status {
      display: grid;
      gap: 10px;
      margin: 0;
    }

    .status div {
      display: flex;
      justify-content: space-between;
      color: var(--muted);
      font-size: 12px;
    }

    .status b { color: var(--text); }

    @media (max-width: 1100px) {
      body { min-width: 0; }
      .page { width: min(100% - 24px, 920px); }
      .layout { grid-template-columns: 1fr 1fr; }
      .stage { grid-column: 1 / -1; grid-row: 1; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="page-header">
      <div>
        <p class="eyebrow">VIRTUAL FLEET / UNITY BRIDGE</p>
        <h1>算法仿真</h1>
        <p class="subtitle">虚拟 UAV、USV 与目标设备的算法和运动验证</p>
      </div>
      <div class="online">UNITY BRIDGE ONLINE</div>
    </header>

    <section class="layout">
      <aside>
        <div class="panel">
          <div class="panel-title">场景配置 <span>V3 PROTOCOL</span></div>
          <label>算法</label>
          <select>
            <option>GB-SFLA-CS 协同围捕（模拟）</option>
            <option>混合 UAV/USV 护航守卫（模拟）</option>
          </select>
          <label>UAV 数量</label>
          <input class="field" value="3">
          <label>USV 数量</label>
          <input class="field" value="3">
          <button>生成场景</button>
        </div>
        <div class="panel">
          <div class="panel-title">任务控制 <span>STOPPED</span></div>
          <button>开始任务</button>
        </div>
      </aside>

      <section class="panel stage">
        <div class="stage-head">
          <strong>Unity WebGL 虚拟场景</strong>
          <strong>3 UAV / 3 USV</strong>
        </div>
        <div class="ocean">
          <div class="trail blue"></div>
          <div class="trail orange"></div>
          <i class="device uav one"></i>
          <i class="device uav two"></i>
          <i class="device uav three"></i>
          <i class="device usv one"></i>
          <i class="device usv two"></i>
          <i class="device usv three"></i>
        </div>
      </section>

      <aside>
        <div class="panel">
          <div class="panel-title">协议状态 <span>LIVE</span></div>
          <dl class="status">
            <div><span>运行模式</span><b>VIRTUAL</b></div>
            <div><span>任务状态</span><b>STOPPED</b></div>
            <div><span>序列号</span><b>0</b></div>
            <div><span>轨迹</span><b>VISIBLE</b></div>
          </dl>
        </div>
        <div class="panel">
          <div class="panel-title">最近回执 <span>NONE</span></div>
          <p class="subtitle">等待 Unity 回执...</p>
        </div>
      </aside>
    </section>
  </main>
</body>
</html>
